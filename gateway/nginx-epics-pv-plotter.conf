# EPICS PV Plotter - production frontend + API/WebSocket reverse proxy
#
# Serves the Vite production build from /var/www/epics-pv-plotter and
# proxies /api and /ws to the FastAPI gateway on 127.0.0.1:8000 so the
# frontend can talk to the backend same-origin (no hardcoded host/port,
# no CORS).
#
# Install:
#   sudo cp gateway/nginx-epics-pv-plotter.conf /etc/nginx/sites-available/epics-pv-plotter
#   sudo ln -s /etc/nginx/sites-available/epics-pv-plotter /etc/nginx/sites-enabled/
#   sudo rm /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /var/www/epics-pv-plotter;
    index index.html;

    # React Router client-side routes (e.g. /config) fall back to index.html
    location / {
        try_files $uri /index.html;
    }

    # EPICS PV WebSocket stream
    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # REST API (aliases, EGUs, layouts, subscriptions)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
    }
}
